# Build TWRP malachite (vendor_boot.img) di GitHub Actions.
name: Build TWRP (malachite)

env:
  REPO_SYNC_JOBS: 1
  BUILD_JOBS: 1
  MIN_FREE_MB: 20000
  BUILD_DISK_CRIT_MB: 4000

on:
  workflow_dispatch:
    inputs:
      selinux_permissive:
        description: "Tambah androidboot.selinux=permissive di cmdline? (default TIDAK; aktifkan hanya kalau recovery gagal karena SELinux)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Siapkan ruang kerja (bersihkan + pilih disk terbesar + cek cukup)
        run: |
          echo "CPU: $(nproc --all) | RAM: $(free -g | awk '/Mem:/ {print $2}') GB"
          echo "--- disk SEBELUM bersih-bersih"; df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /opt/microsoft /opt/google \
            /usr/local/share/powershell /usr/lib/google-cloud-sdk /usr/lib/jvm /usr/share/miniconda \
            /usr/local/julia* /usr/lib/firefox /opt/az || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "--- disk SESUDAH bersih-bersih"; df -h / /mnt
          ROOT_MB=$(df -BM --output=avail / | tail -1 | tr -dc '0-9')
          MNT_MB=$(df -BM --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9')
          MNT_MB=${MNT_MB:-0}
          echo "Sisa: / = ${ROOT_MB} MB, /mnt = ${MNT_MB} MB"
          if [ "$MNT_MB" -gt "$ROOT_MB" ] && [ "$MNT_MB" -gt 15000 ]; then
            WORKDIR=/mnt/twrp; AVAIL=$MNT_MB
            sudo mkdir -p /mnt/twrp && sudo chown -R "$(id -u):$(id -g)" /mnt/twrp
            ln -sfn /mnt/twrp /home/runner/twrp
          else
            WORKDIR=/home/runner/twrp; AVAIL=$ROOT_MB
            mkdir -p /home/runner/twrp
          fi
          echo "WORKDIR=$WORKDIR" >> "$GITHUB_ENV"
          echo "Ruang kerja: $WORKDIR dengan ${AVAIL} MB bebas"
          if [ "$AVAIL" -lt "$MIN_FREE_MB" ]; then
            echo "::error::Disk runner cuma ${AVAIL} MB bebas. Butuh sekitar ${MIN_FREE_MB} MB supaya build tidak dibunuh runner."
            exit 1
          fi

      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-core git-lfs gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 lz4 bc ccache rsync libssl-dev
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"
          git config --global color.ui false
          sudo apt-get clean

      - name: Sync manifest TWRP minimal (twrp-14.1) dengan penjaga disk
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          (
            while true; do
              A=$(df -BM --output=avail "$WORKDIR" | tail -1 | tr -dc '0-9')
              if [ "${A:-0}" -lt 2000 ]; then
                echo "::error::DISK KRITIS (${A} MB tersisa), sync dihentikan"
                pkill -f "repo" || true
                break
              fi
              sleep 5
            done
          ) &
          GUARD=$!
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
          set +e
          repo sync -c -j"${REPO_SYNC_JOBS}" --force-sync --no-clone-bundle --no-tags
          RC=$?
          kill "$GUARD" 2>/dev/null || true
          echo "--- hasil sync: rc=$RC"; df -h "$WORKDIR"; du -sh .repo . 2>/dev/null || true
          exit "$RC"

      - name: Tempatkan device tree pada path yang benar untuk build TWRP
        run: |
          set -euxo pipefail
          cd ~/twrp
          mkdir -p device/xiaomi
          rm -rf device/xiaomi/malachite
          cp -a "$GITHUB_WORKSPACE/device_tree" device/xiaomi/malachite
          ls -ld device/xiaomi/malachite
          test -f device/xiaomi/malachite/twrp_malachite.mk

      - name: Build vendor_boot
        env:
          PERM: ${{ inputs.selinux_permissive }}
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export CCACHE_DIR="$WORKDIR/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache -M 8G >/dev/null || true
          if [ "$PERM" = "true" ]; then export MALACHITE_RECOVERY_PERMISSIVE=true; fi

          (
            while true; do
              A=$(df -BM --output=avail "$WORKDIR" | tail -1 | tr -dc '0-9')
              if [ "${A:-0}" -lt "$BUILD_DISK_CRIT_MB" ]; then
                echo "::error::DISK KRITIS (${A} MB tersisa), build dihentikan sebelum runner dibunuh"
                pkill -f "mka|soong|java" || true
                exit 1
              fi
              sleep 15
            done
          ) &

          GUARD=$!
          set +e
          source build/envsetup.sh
          lunch twrp_malachite-ap2a-eng
          mka vendorbootimage -j"${BUILD_JOBS}" 2>&1 | tee ~/build.log
          RC=${PIPESTATUS[0]}
          kill "$GUARD" 2>/dev/null || true
          echo "--- hasil build: rc=$RC"; df -h "$WORKDIR"
          exit "$RC"
